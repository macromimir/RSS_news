<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mobile Review Queue</title>
  <style>
    body{font-family:Arial,sans-serif;margin:12px;background:#fff;color:#111}
    .top{position:sticky;top:0;background:#fff;padding:8px 0;border-bottom:1px solid #ddd}
    .row{border:1px solid #ddd;border-radius:8px;padding:10px;margin:10px 0}
    .t{font-weight:700}
    .m{font-size:12px;color:#555;margin:4px 0}
    .s{white-space:pre-wrap;font-size:13px;line-height:1.3}
    .tog{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px}
    label{font-size:12px}
    .ok{color:#0a7a0a}
    .bad{color:#b00000}
    input[type=text]{width:100%;padding:8px}
    button{padding:8px 10px}
  </style>
</head>
<body>
  <div class="top">
    <div><strong>Mobile Review Queue</strong></div>
    <div class="m">Configure once: Supabase URL + anon key (saved in browser).</div>
    <input id="url" type="text" placeholder="SUPABASE_URL (https://...supabase.co)">
    <input id="key" type="text" placeholder="SUPABASE_ANON_KEY">
    <button onclick="saveCfg()">Save Config</button>
    <button onclick="loadRows()">Refresh</button>
    <div id="status" class="m"></div>
  </div>
  <div id="rows"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const TABLE = "mobile_review_queue";
    const rowsEl = document.getElementById("rows");
    const statusEl = document.getElementById("status");
    let client = null;

    function setStatus(text, ok=true){
      statusEl.textContent = text;
      statusEl.className = ok ? "m ok" : "m bad";
    }

    function saveCfg(){
      localStorage.setItem("sb_url", document.getElementById("url").value.trim());
      localStorage.setItem("sb_key", document.getElementById("key").value.trim());
      init();
    }

    function init(){
      const url = localStorage.getItem("sb_url") || "";
      const key = localStorage.getItem("sb_key") || "";
      document.getElementById("url").value = url;
      document.getElementById("key").value = key;
      if(!url || !key){
        setStatus("Enter Supabase URL + anon key, then Save Config.", false);
        return false;
      }
      client = window.supabase.createClient(url, key);
      return true;
    }

    async function loadRows(){
      if(!init()) return;
      setStatus("Loading...");
      const {data, error} = await client
        .from(TABLE)
        .select("*")
        .order("article_date", {ascending:false})
        .limit(1000);
      if(error){ setStatus(error.message, false); return; }
      rowsEl.innerHTML = "";
      (data || []).forEach(r => rowsEl.appendChild(renderRow(r)));
      setStatus(`Loaded ${(data||[]).length} row(s).`);
    }

    function renderRow(r){
      const div = document.createElement("div");
      div.className = "row";
      div.innerHTML = `
        <div class="t">${esc(r.title || "")}</div>
        <div class="m">ID ${r.article_id} | ${esc(r.source_name || "")} | ${esc(r.article_date || "")}</div>
        <div><a href="${esc(r.url || "")}" target="_blank">Open Article</a></div>
        <div class="s">${esc(r.ai_summary || "")}</div>
        <div class="tog">
          ${toggle(r, "reviewed", "Reviewed")}
          ${toggle(r, "read_later", "Read Later")}
          ${toggle(r, "send_to_rss", "Include RSS")}
          ${toggle(r, "web_rss", "Include WebRSS")}
          ${toggle(r, "review_tag", "Review Tag")}
        </div>
      `;
      return div;
    }

    function toggle(r, field, label){
      const checked = Number(r[field]||0)===1 ? "checked" : "";
      return `<label><input type="checkbox" ${checked} onchange="setFlag(${r.article_id}, '${field}', this.checked)"> ${label}</label>`;
    }

    async function setFlag(articleId, field, checked){
      if(!client){ setStatus("Client not initialized", false); return; }
      const payload = {};
      payload[field] = checked ? 1 : 0;
      payload.updated_at = new Date().toISOString();
      const {error} = await client.from(TABLE).update(payload).eq("article_id", articleId);
      if(error){ setStatus(error.message, false); return; }
      setStatus(`Saved ID ${articleId} ${field}=${checked ? 1 : 0}`);
    }

    function esc(v){ return String(v ?? "").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;"); }

    loadRows();
  </script>
</body>
</html>
